---
ingredients:
  - 2 cans condensed cream of mushroom soup
  - 1 1/2 cups milk
  - 1 tsp pepper
  - 4 cans green beans
  - 3.5 cups crispy fried onions
steps:
  -2: Mix 2 cans cream of mushroom soup, 1 1/2 cups milk, 1 tsp pepper in baking dish. Mix in 4 cans drained green beans and 1.5 cups crispy fried onions.
  -1: Preheat oven for casserole to 350F
  0: Put green bean casserole in oven.
  40: Stir casserole. Top with 2 cups of crispy fried onions.
  45: Remove casserole from oven.
  48: Serve.
