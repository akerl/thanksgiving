---
ingredients:
  - 8 lb russet potatoes
  - 2 cups milk
  - 2 cups butter
  - 2 TBSP salt
  - 2 TBSP pepper
steps:
  -2: Peel and chop 8lbs of russet potatoes into one inch chunks.
  0: Fill pot halfway with water, put on to boil.
  30: Put potatoes into pot.
  45: Drain potatoes, return to pan with milk/butter/salt/pepper. Mash.
  50: Serve.
